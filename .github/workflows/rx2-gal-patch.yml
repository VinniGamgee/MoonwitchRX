name: Apply RX2 GAL Low Latency

on:
  push:
    branches: [ rx2/perf-migration ]
    paths:
      - '.github/workflows/rx2-gal-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rx2/perf-migration
          fetch-depth: 0

      - name: Apply RX2 GAL producer wait patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/Ryujinx.Graphics.GAL/Multithreading/ThreadedRenderer.cs')
          s = p.read_text()
          old = '''            while (_producerPtr == (Volatile.Read(ref _consumerPtr) + QueueCount - 1) % QueueCount)
            {
                // If incrementing the producer pointer would overflow, we need to wait.
                // _consumerPtr can only move forward, so there's no race to worry about here.

                Thread.Sleep(1);
            }
'''
          new = '''            int queueWaitSpins = 0;
            while (_producerPtr == (Volatile.Read(ref _consumerPtr) + QueueCount - 1) % QueueCount)
            {
                // RX2: This is a hot producer/consumer hand-off. Thread.Sleep(1) can
                // oversleep by multiple milliseconds on Android and stall command submission.
                // Briefly spin, then yield the remainder of the timeslice without a 1 ms sleep.
                if (queueWaitSpins++ < 64)
                {
                    Thread.SpinWait(64);
                }
                else
                {
                    Thread.Yield();
                    queueWaitSpins = 0;
                }
            }
'''
          if old not in s:
              raise SystemExit('ThreadedRenderer queue wait pattern not found')
          p.write_text(s.replace(old, new, 1))

          g = Path('src/KenjinxAndroid/app/build.gradle')
          s = g.read_text()
          if "versionName '2.1.0-pr.2-rx1'" not in s:
              raise SystemExit('RX1 version string not found')
          s = s.replace("versionName '2.1.0-pr.2-rx1'", "versionName '2.1.0-pr.2-rx2-gal'", 1)
          g.write_text(s)
          PY

      - name: Commit RX2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Ryujinx.Graphics.GAL/Multithreading/ThreadedRenderer.cs src/KenjinxAndroid/app/build.gradle
          git commit -m 'RX2: low-latency GAL queue wait'
          git push origin rx2/perf-migration
