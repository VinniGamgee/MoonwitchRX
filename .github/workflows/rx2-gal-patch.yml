name: Apply RX2 GAL Low Latency

on:
  push:
    branches:
      - rx2/perf-migration
    paths:
      - .github/workflows/rx2-gal-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rx2/perf-migration
          fetch-depth: 0

      - name: Apply RX2 GAL producer wait patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/Ryujinx.Graphics.GAL/Multithreading/ThreadedRenderer.cs")
          s = p.read_text()

          loop = "            while (_producerPtr == (Volatile.Read(ref _consumerPtr) + QueueCount - 1) % QueueCount)"
          if loop not in s:
              raise SystemExit("ThreadedRenderer queue loop not found")
          s = s.replace(loop, "            int queueWaitSpins = 0;\n" + loop, 1)

          old = "                Thread.Sleep(1);"
          new = "                if (queueWaitSpins++ < 64)\n                {\n                    Thread.SpinWait(64);\n                }\n                else\n                {\n                    Thread.Yield();\n                    queueWaitSpins = 0;\n                }"
          if old not in s:
              raise SystemExit("ThreadedRenderer sleep not found")
          p.write_text(s.replace(old, new, 1))

          g = Path("src/KenjinxAndroid/app/build.gradle")
          s = g.read_text()
          if "versionName '2.1.0-pr.2-rx1'" not in s:
              raise SystemExit("RX1 version string not found")
          g.write_text(s.replace("versionName '2.1.0-pr.2-rx1'", "versionName '2.1.0-pr.2-rx2-gal'", 1))
          PY

      - name: Commit RX2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Ryujinx.Graphics.GAL/Multithreading/ThreadedRenderer.cs src/KenjinxAndroid/app/build.gradle
          git commit -m 'RX2: low-latency GAL queue wait'
          git push origin rx2/perf-migration
