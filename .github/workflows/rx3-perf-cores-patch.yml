name: Apply RX3 Performance Cores

on:
  push:
    branches:
      - rx3/perf-cores-build
    paths:
      - '.github/workflows/rx3-perf-cores-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rx3/perf-cores-build
          fetch-depth: 0

      - name: Apply RX3 patch
        run: python3 .github/scripts/apply_rx3_perfcores.py

      - name: Commit RX3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KenjinxAndroid/app/src/main/cpp/kenjinx.cpp src/LibKenjinx/LibKenjinx.Graphics.cs src/Ryujinx.Cpu/Nce/NceCpuContext.cs src/KenjinxAndroid/app/build.gradle
          git commit -m 'RX3: route critical Android threads to performance cores'
          git push origin rx3/perf-cores-build
